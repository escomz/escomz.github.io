<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visor de código — GitHub</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<style>
  :root { --accent: #2cd326; --bg: #f4f4f9; }
  * { box-sizing: border-box; }
  body { font-family: Arial, sans-serif; margin: 0; background: var(--bg); color: #222; }
  header { background: #1d3557; color: #fff; padding: 1.5rem; text-align: center; }
  header h1 { margin: 0 0 .3rem; }
  header p { margin: 0; opacity: .8; font-size: .95rem; }
  main { max-width: 1000px; margin: 0 auto; padding: 1.5rem; }
  .panel { background: #fff; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,.1); padding: 1.2rem; margin-bottom: 1.2rem; }
  label { display: block; font-weight: bold; margin-bottom: .4rem; }
  .row { display: flex; gap: .6rem; flex-wrap: wrap; }
  input[type=text] { flex: 1; min-width: 250px; padding: .6rem .8rem; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; }
  button { padding: .6rem 1.2rem; border: 0; border-radius: 6px; background: #1d3557; color: #fff; font-size: 1rem; cursor: pointer; }
  button:hover { background: #457b9d; }
  .chips { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: .8rem; }
  .chip { background: #e8e8ef; border: 0; border-radius: 999px; padding: .35rem .9rem; font-size: .9rem; cursor: pointer; color: #1d3557; }
  .chip:hover { background: var(--accent); color: #fff; }
  #archivo { font-family: Consolas, Monaco, monospace; font-size: .9rem; color: #457b9d; margin: .2rem 0 .8rem; word-break: break-all; }
  pre { margin: 0; border-radius: 8px; overflow-x: auto; }
  pre code { font-family: Consolas, Monaco, monospace; font-size: .92rem; display: block; padding: 1.2rem !important; }
  #error { color: #e63946; font-weight: bold; display: none; margin: 1rem 0; }
  #estado { color: #666; display: none; margin: 1rem 0; }
  .tip { background: #e8f8e8; border-left: 4px solid var(--accent); padding: .7rem 1rem; border-radius: 0 6px 6px 0; font-size: .95rem; }
  @media print { header, .panel { box-shadow: none; } }
</style>
</head>
<body>

<header>
  <h1>Visor de código</h1>
  <p>Pega el enlace de un fichero de GitHub o elige uno del proyecto</p>
</header>

<main>
  <div class="panel">
    <label for="url">Enlace del fichero en GitHub</label>
    <div class="row">
      <input type="text" id="url" placeholder="https://github.com/usuario/repo/blob/main/ruta/fichero.ext">
      <button id="ver">Ver código</button>
    </div>
    <div class="chips" id="chips"></div>
    <p class="tip">Sirve con enlaces <code>blob</code> o <code>raw</code> de github.com. El contenido se descarga en crudo desde <code>raw.githubusercontent.com</code>.</p>
  </div>

  <div class="panel">
    <div id="archivo"></div>
    <div id="estado">Cargando…</div>
    <div id="error"></div>
    <pre><code id="codigo"></code></pre>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>
  const REPO = "escomz/escomz.github.io";
  const ARCHIVOS = [
    { ruta: "proyecto1/index.html", etiqueta: "index.html" },
    { ruta: "proyecto1/style.css", etiqueta: "style.css" },
    { ruta: "proyecto1/script.js", etiqueta: "script.js" },
    { ruta: "proyecto1/src/script.ts", etiqueta: "src/script.ts" },
    { ruta: "proyecto1/compiled/script.js", etiqueta: "compiled/script.js" },
    { ruta: "proyecto1/package.json", etiqueta: "package.json" },
    { ruta: "proyecto1/tsconfig.json", etiqueta: "tsconfig.json" },
  ];

  const $url = document.getElementById("url");
  const $codigo = document.getElementById("codigo");
  const $archivo = document.getElementById("archivo");
  const $error = document.getElementById("error");
  const $estado = document.getElementById("estado");

  const chips = document.getElementById("chips");
  ARCHIVOS.forEach((a) => {
    const b = document.createElement("button");
    b.className = "chip";
    b.textContent = a.etiqueta;
    b.onclick = () => cargar(`https://raw.githubusercontent.com/${REPO}/main/${a.ruta}`, a.ruta);
    chips.appendChild(b);
  });

  function aRaw(enlace) {
    const u = enlace.trim();
    if (u.startsWith("https://raw.githubusercontent.com/")) return u;
    const m = u.match(/github\.com\/([^/]+)\/([^/]+)\/(?:blob|raw)\/(.+)$/);
    if (m) return `https://raw.githubusercontent.com/${m[1]}/${m[2]}/${m[3]}`;
    return null;
  }

  function lenguaje(nombre) {
    if (nombre.endsWith(".ts")) return "typescript";
    if (nombre.endsWith(".js")) return "javascript";
    if (nombre.endsWith(".css")) return "css";
    if (nombre.endsWith(".json")) return "json";
    if (nombre.endsWith(".html")) return "xml";
    return "plaintext";
  }

  async function cargar(rawUrl, nombre) {
    $error.style.display = "none";
    $estado.style.display = "block";
    $codigo.textContent = "";
    $archivo.textContent = rawUrl;
    try {
      const resp = await fetch(rawUrl);
      if (!resp.ok) throw new Error("HTTP " + resp.status);
      const texto = await resp.text();
      const nombreFichero = nombre || rawUrl.split("/").pop();
      $codigo.className = "language-" + lenguaje(nombreFichero);
      $codigo.textContent = texto;
      hljs.highlightElement($codigo);
    } catch (e) {
      $codigo.textContent = "";
      $error.textContent = "No se pudo cargar el código: " + e.message +
        " (¿es el enlace de un fichero y el repositorio es público?)";
      $error.style.display = "block";
    } finally {
      $estado.style.display = "none";
    }
  }

  document.getElementById("ver").onclick = () => {
    const raw = aRaw($url.value);
    if (!raw) {
      $error.textContent = "El enlace no parece un fichero de GitHub. Ejemplo: https://github.com/escomz/escomz.github.io/blob/main/proyecto1/index.html";
      $error.style.display = "block";
      return;
    }
    cargar(raw);
  };
  $url.addEventListener("keydown", (e) => { if (e.key === "Enter") document.getElementById("ver").click(); });

  const inicial = new URLSearchParams(location.search).get("f");
  if (inicial) {
    $url.value = inicial;
    const raw = aRaw(inicial);
    if (raw) cargar(raw);
  }
</script>
</body>
</html>
